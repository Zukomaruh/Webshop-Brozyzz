<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../components/header.js"></script>
    <title>Admin-Bereich</title>
</head>
<body style="display:none;">
<div class="container mt-2">
    <h1 class="mb-4">Hallo Admin</h1>
    <button id="btnShowProductList" class="btn btn-primary">Product list</button>
    <button id="btnShowAddProduct" class="btn btn-outline-primary ms-2">Add product</button>
    <button id="btnShowCustomerList" class="btn btn-outline-primary ms-2">Customer list</button>
</div>

<div id="addProductView" class="container mt-2" style="display:none;">
    <div class="alert alert-info">Here you can create new products.</div>
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-4">New Product</h3>
            <form id="createProductForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="productName" class="form-label">Product name</label>
                    <input type="text" class="form-control" id="productName" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="productDescription" class="form-label">Description</label>
                    <textarea class="form-control" id="productDescription" name="description" rows="4" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="productPrice" class="form-label">Price</label>
                    <input type="number" class="form-control" id="productPrice" name="price" step="0.01" min="0" required>
                </div>
                <div class="mb-3">
                    <label for="productCategory" class="form-label">Category</label>
                    <select class="form-control" id="productCategory" name="category" required>
                        <option value="">Please Choose</option>
                        <option value="Supplements">Supplements</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Equipment">Equipment</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="productRating" class="form-label">Rating (1-5)</label>
                    <input type="number" class="form-control" id="productRating" name="rating" min="1" max="5" required>
                </div>
                <div class="mb-3">
                    <label for="productImage" class="form-label">Product image</label>
                    <input type="file" class="form-control" id="productImage" name="image" accept=".jpg,.jpeg,.png,.webp" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Product</button>
            </form>
            <div id="productMessage" class="mt-3 text-center"></div>
        </div>
    </div>
</div>

<div id="productListView" class="container mt-2">
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Picture</th>
            <th>Description</th>
            <th>Price</th>
            <th>Category</th>
            <th>Rating</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="productTableBody">
        </tbody>
    </table>
</div>

<div id="customerListView" class="container mt-2" style="display:none;">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Status</th> <th class="text-end" style="width: 300px;">Actions</th> </tr>
        </thead>
        <tbody id="customerTableBody">
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../assets/js/admin.js"></script>
<script src="../components/navbar.js"></script>
<script src="../assets/js/authGuard.js"></script>
</body>
</html>
