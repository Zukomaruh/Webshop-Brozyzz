<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../components/header.js"></script>
    <title>Basket</title>
    <!--Braucht man für Euro-Zeichen Display-->
    <meta charset="UTF-8">
</head>
<body>
<div class="container mt-5">
    <h2>Your basket</h2>
    <table class="table mt-4">
        <thead>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Sum</th>
        </tr>
        </thead>
        <tbody id="cartTableBody">
        <!-- Wird per JS befüllt -->
        </tbody>
        <tfoot id="cartTableFoot">
        <!-- Gesamtsumme kommt hier rein -->
        </tfoot>
    </table>
    <a href="../index.html" class="btn btn-secondary">Continue shopping</a>
    <button id="btnCheckout" class="btn btn-success">Checkout</button>
    <div id="checkoutMsg" class="mt-3"></div>
</div>
<div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Your Order</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <!-- Userdaten -->
                <h6 class="text-secondary">Delivery & Payment</h6>
                <p id="modalUserInfo"></p>
                <div class="mb-3">
                    <label for="checkoutPaymentMethod" class="form-label">Payment Method</label>
                    <select class="form-select" id="checkoutPaymentMethod"></select>
                </div>
                <hr>
                <!-- Bestellübersicht -->
                <h6 class="text-secondary">Your Order</h6>
                <table class="table table-sm">
                    <tbody id="modalCartItems"></tbody>
                    <tfoot id="modalCartTotal"></tfoot>
                </table>
            </div>
            <div class="modal-footer">
                <a href="profile.html" class="btn btn-outline-secondary">Edit Profile</a>
                <button type="button" class="btn btn-success" id="btnConfirmOrder">Confirm Order</button>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../components/navbar.js"></script>
<script src="../assets/js/basket.js"></script>
</body>
</html>
