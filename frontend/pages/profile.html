<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../components/header.js"></script>
    <title>Profile</title>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h2 class="mb-0">My Profile</h2>
                </div>
                <div class="card-body">
                    <!-- Profile Tabs -->
                    <ul class="nav nav-tabs mb-4" id="profileTabs">
                        <li class="nav-item">
                            <button class="nav-link active" id="tabPersonalInfo" type="button">
                                Personal Information
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="tabMyOrders" type="button">
                                My Orders
                            </button>
                        </li>
                    </ul>

                    <div id="profileMessage" class="alert d-none"></div>

                    <div id="personalInfoSection">
                        <form id="profileForm">
                            <!-- Personal Information -->
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h4 class="mb-0 text-secondary">Personal Information</h4>
                                <button id="btnToggleEdit" type="button" class="btn btn-outline-primary btn-sm">
                                    Edit Profile
                                </button>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label for="gender" class="form-label">Title</label>
                                    <select class="form-select" id="gender" required disabled>
                                        <option value="mr">Mr.</option>
                                        <option value="ms">Ms.</option>
                                        <option value="other">Diverse</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName" required disabled>
                                </div>
                                <div class="col-md-4">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" required disabled>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username" required disabled>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="email" required disabled>
                                </div>
                            </div>

                            <!-- Address -->
                            <h4 class="mb-3 mt-4 text-secondary">Address</h4>
                            <div class="mb-3">
                                <label for="address" class="form-label">Address (Street, No.)</label>
                                <input type="text" class="form-control" id="address" required disabled>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label for="zip" class="form-label">ZIP Code</label>
                                    <input type="text" class="form-control" id="zip" required disabled>
                                </div>
                                <div class="col-md-8">
                                    <label for="city" class="form-label">City</label>
                                    <input type="text" class="form-control" id="city" required disabled>
                                </div>
                            </div>

                            <!-- Payment Details -->
                            <!-- Payment Details -->
                            <h4 class="mb-3 mt-4 text-secondary">Payment Details</h4>

                            <!-- Default Payment (bestehend, read-only Bereich) -->
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="paymentMethod" class="form-label">Default Payment Method</label>
                                    <select class="form-select" id="paymentMethod" required disabled>
                                        <option value="invoice">Invoice</option>
                                        <option value="creditcard">Credit Card</option>
                                    </select>
                                </div>
                                <div class="col-md-6" id="cardGroup" style="display:none;">
                                    <label for="paymentDetails" class="form-label">Credit Card Number</label>
                                    <input type="text" class="form-control" id="paymentDetails" disabled>
                                </div>
                            </div>

                            <!-- Weitere gespeicherte Payment Methods -->
                            <div id="additionalPaymentMethodsSection" class="mt-3">
                                <div id="additionalPaymentMethodsList" class="mb-2">
                                    <!-- wird per JS befüllt -->
                                </div>

                                <!-- Add-Button (immer sichtbar) -->
                                <button type="button" id="btnAddPaymentMethod" class="btn btn-outline-secondary btn-sm mt-1">
                                    + Add Payment Method
                                </button>

                                <!-- Inline-Formular (standardmäßig versteckt) -->
                                <div id="addPaymentMethodForm" class="mt-3 p-3 border rounded bg-light" style="display:none;">
                                    <h6 class="mb-3">New Payment Method</h6>
                                    <div class="row g-2 align-items-end">
                                        <div class="col-md-4">
                                            <label class="form-label">Method</label>
                                            <select class="form-select form-select-sm" id="newPaymentMethodSelect">
                                                <option value="">-- Select --</option>
                                                <option value="invoice">Invoice</option>
                                                <option value="creditcard">Credit Card</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4" id="newCardDetailsGroup" style="display:none;">
                                            <label class="form-label">Card Number</label>
                                            <input type="text" class="form-control form-control-sm" id="newPaymentDetails"
                                                   placeholder="Card number">
                                        </div>
                                        <div class="col-auto">
                                            <button type="button" id="btnSaveNewPayment" class="btn btn-success btn-sm">Save</button>
                                            <button type="button" id="btnCancelNewPayment" class="btn btn-secondary btn-sm ms-1">Cancel</button>
                                        </div>
                                    </div>
                                    <div id="addPaymentMsg" class="mt-2" style="display:none;"></div>
                                </div>
                            </div>

                            <!-- Optische Leseattrape des Passwort felds für den Lesemodus -> keine pw-Daten übertragen!-->
                            <div id="dummyPasswordGroup" class="mb-3 mt-4">
                                <h4 class="mb-3 text-secondary">Security</h4>
                                <div class="row">
                                    <div class="col-md-6">
                                        <label class="form-label">Password</label>
                                        <input type="password" class="form-control" value="********" disabled>
                                    </div>
                                </div>
                            </div>

                            <!-- Passwort-Änderungs-Sektion (Standardmäßig versteckt, überschreibt dummy feld oben im edit mode) -->
                            <div id="passwordChangeGroup" class="p-3 bg-light rounded border mt-4" style="display: none !important;">
                                <h4 class="mb-3 text-secondary">Change Password (Optional)</h4>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="newPassword" class="form-label">New Password</label>
                                        <input type="password" class="form-control" id="newPassword">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="confirmNewPassword" class="form-label">Repeat New Password</label>
                                        <input type="password" class="form-control" id="confirmNewPassword">
                                    </div>
                                </div>
                            </div>

                            <!-- Passwort-Bestätigungs-Sektion (Standardmäßig versteckt) -->
                            <div id="passwordConfirmGroup" class="p-3 bg-light rounded border mt-4" style="display: none !important;">
                                <h5 class="text-danger mb-2">Confirm Changes</h5>
                                <p class="small text-muted">Please enter your current password to save these changes.</p>
                                <div class="mb-2">
                                    <label for="passwordConfirm" class="form-label fw-bold">Current Password</label>
                                    <input type="password" class="form-control" id="passwordConfirm">
                                </div>
                            </div>

                            <!-- Buttons (Standardmäßig versteckt) -->
                            <div id="actionButtons" class="mt-4 d-flex gap-2" style="display: none !important;">
                                <button type="submit" class="btn btn-success flex-grow-1">Save Changes</button>
                                <button type="button" id="btnCancelEdit" class="btn btn-secondary">Cancel</button>
                            </div>
                        </form>
                    </div>



                    <!-- My Orders -->
                        <div id="myOrdersSection" class="d-none">
                            <h4 class="mb-3 text-secondary">My Orders</h4>

                            <div id="ordersMsg" class="mb-3"></div>

                            <div id="ordersTableWrapper" class="table-responsive d-none">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                    <tr>
                                        <th>Order ID</th>
                                        <th>Date</th>
                                        <th>Total Price</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody id="ordersTableBody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../components/navbar.js"></script>
<script src="../assets/js/authGuard.js"></script>
<script> requireLogin(); </script>
<script src="../assets/js/orderUtils.js"></script>
<script src="../assets/js/profile.js"></script>
</body>
</html>
