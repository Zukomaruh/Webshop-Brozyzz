<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <script src="../components/header.js"></script>
    <title>Register - Brozyzz Shop</title>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-4 text-center">Registration</h2>
            <form id="registerForm">
                <!-- Stammdaten -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="gender" class="form-label">Title</label>
                        <select class="form-select" id="gender" required>
                            <option value="">Please select...</option>
                            <option value="mr">Mr.</option>
                            <option value="ms">Ms.</option>
                            <option value="other">Diverse</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="firstName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="col-md-4">
                        <label for="lastName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" required>
                    </div>
                </div>

                <!-- Account-Daten -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="col-md-6">
                        <label for="registerEmail" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="registerEmail" required>
                    </div>
                </div>

                <!-- Adresse -->
                <div class="mb-3">
                    <label for="address" class="form-label">Address (Street, No.)</label>
                    <input type="text" class="form-control" id="address" required>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="zip" class="form-label">ZIP Code</label>
                        <input type="text" class="form-control" id="zip" required>
                    </div>
                    <div class="col-md-8">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" required>
                    </div>
                </div>

                <!-- Zahlungsinformationen -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="paymentMethod" class="form-label">Payment Method</label>
                        <select class="form-select" id="paymentMethod" required>
                            <option value="Rechnung">Invoice</option>
                            <option value="Kreditkarte">Credit Card</option>
                        </select>
                    </div>
                    <div class="col-md-6" id="cardDetailsGroup" style="display:none;">
                        <label for="paymentDetails" class="form-label">Credit Card Number</label>
                        <input type="text" class="form-control" id="paymentDetails" placeholder="1234 5678 1234 5678">
                    </div>
                </div>

                <!-- Passwörter -->
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="registerPassword" class="form-label">Password</label>
                        <input type="password" class="form-control" id="registerPassword" required>
                    </div>
                    <div class="col-md-6">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <div id="registerMessage" class="mt-3 text-center"></div>
        </div>
    </div>
</div>

<!--Scripte:-->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../assets/js/authentification.js"></script>
<script src="../components/navbar.js"></script>

</body>
</html>
